name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm cargo git sudo

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        run: |
          # --nodeps: `depends` names terracotta-kiln, which lives in this
          # project's own release, not the official repos, so pacman cannot
          # resolve it here — the same reason --syncdeps is not used.
          su builder -c "cd '$GITHUB_WORKSPACE/packaging' && makepkg --nodeps --noconfirm --skippgpcheck --nocheck"

      - name: Compute checksum
        id: pkg
        run: |
          cd packaging
          pkgfile=$(ls -- *.pkg.tar.zst | head -n1)
          sha256sum "$pkgfile" > "$pkgfile.sha256"
          echo "pkgfile=$pkgfile" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/${{ steps.pkg.outputs.pkgfile }}
            packaging/${{ steps.pkg.outputs.pkgfile }}.sha256
